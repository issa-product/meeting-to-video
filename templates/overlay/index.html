      /* ======================================================================================

      const first = (spk) => ((D.names || {})[spk] || "").split(" ")[0];
      const ICONS = {

        play: '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
      };

      }
      const rowHtml = (r, i) => '<div class="row r' + i + '"><span class="ib ' + (TONE[r.icon] || "") + '">' + ic(r.icon) + "</span>" + esc(r.text) + "</div>";

      /* ---------- captions (main speakers) ---------- */
      const presenter = Object.keys(D.names || {})[0];
      D.captions.forEach((c) => {
        const n = el('<div class="cap' + (c.who !== presenter ? " alt" : "") + '">' + c.w.map((w) => '<span class="w' + (w.k ? " k" : "") + '">' + esc(w.x) + "</span>").join(" ") + "</div>");

        const n = el('<div class="chip-ch"><div class="n">Chapter ' + c.n + " of " + D.nch + '</div><div class="t">' + esc(c.title) + "</div></div>");
        if (m.mode === "share") { const bx = colBox(); css(n, { left: bx.x + "px", width: bx.w + "px", top: bx.y - 74 + "px" }); }
        else { const p = panelBox(); css(n, { left: p.x + "px", width: p.w + "px", top: "70px" }); }
        show(n, a, b, { y: 6 });
      }));
      /* ---------- title / chapter / end cards (full frame, slide over the inserted gaps) ---------- */
      function fullCard(html, t0, tEnd, slide) {
        const n = el('<div class="full"><div class="blob b1" data-layout-allow-overflow></div><div class="blob b2" data-layout-allow-overflow></div><div class="blob b3"></div><div class="inner">' + html + "</div></div>");
        gsap.set(n, { autoAlpha: 0 });
        tl.fromTo(n, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: "none", immediateRender: false }, t0);
        tl.fromTo(n, { xPercent: -100 }, { xPercent: 0, duration: slide, ease: "power3.out", immediateRender: false }, t0);
        tl.fromTo(n.querySelector(".b1"), { scale: 0.65, rotate: -20 }, { scale: 1, rotate: 0, duration: 0.85, ease: "back.out(1.4)", immediateRender: false }, t0 + 0.05);
        if (tEnd != null) { tl.to(n, { xPercent: 100, duration: COVER, ease: "power3.in" }, tEnd); tl.to(n, { autoAlpha: 0, duration: 0.04, ease: "none" }, tEnd + COVER - 0.04); }
        return n;
      }
      {
        const T = D.title, t0 = T.start - COVER;
        const n = fullCard('<div class="kick">' + esc(T.kicker || "Walkthrough") + '</div><div class="big">' + (T.big || "") + '</div><div class="sub">' + esc(T.sub || "") + "</div>", t0, null, COVER);
        [".kick", ".big", ".sub"].forEach((s, k) => reveal(n.querySelector(s), t0 + 0.2 + k * 0.12, { y: 24 }));
        tl.to(n, { autoAlpha: 0, duration: 0.04, ease: "none" }, T.start + T.dur + COVER - 0.04);
      }
      D.chapters.forEach((c) => {
        const t0 = c.n === 1 ? c.start : c.start - COVER;
        const n = fullCard('<div class="num">' + String(c.n).padStart(2, "0") + '</div><div class="kick">' + esc(c.kicker) + '</div><div class="big">' + esc(c.title) + "</div>", t0, c.start + c.dur, COVER);
        reveal(n.querySelector(".num"), t0 + 0.14, { s: 0.6, y: 0, ease: "back.out(2)" }); reveal(n.querySelector(".kick"), t0 + 0.22, { y: 18 }); reveal(n.querySelector(".big"), t0 + 0.3, { y: 26 });
      });
      {
        const E = D.end, t0 = E.start - COVER;
        const n = fullCard('<div class="kick">' + esc(E.kicker || "That's the tour") + '</div><div class="big">' + esc(E.big || "Questions?") + '</div><div class="pill">' + ic("msg") + esc(E.cta || "") + '</div><div class="sub" style="margin-top:44px">' + esc(E.sub || "") + "</div>", t0, null, COVER + 0.1);
        reveal(n.querySelector(".kick"), t0 + 0.3, { y: 18 }); reveal(n.querySelector(".big"), t0 + 0.42, { y: 26 });
        reveal(n.querySelector(".pill"), t0 + 0.9, { s: 0.8, y: 0, ease: "back.out(1.8)" }); reveal(n.querySelector(".sub"), t0 + 1.6, { y: 14 });
      }

      /* ---------- graphics: one renderer per type (see references/motion-graphics.md) ---------- */
      const R = {
        kinetic(g) {   // lines that land on their word: {lines:[{t, text, style:"big|mid|pill", strike_t?, icon?}]}; pos "free" = big text over the card with a scrim
          const free = g.pos === "free";
          g = Object.assign({}, g, { t0: Math.max(g.t0, g.lines[0].t - 0.2) });   // never an empty card: arrive with the first line
          const html = '<div class="kin' + (free ? " free" : "") + '">' + g.lines.map((l, i) => '<div class="l l' + i + " " + (l.style || "big") + '">' + (l.icon ? ic(l.icon) : "") + esc(l.text) + (l.strike_t ? '<span class="strike"></span>' : "") + "</div>").join("") + "</div>";
          let n;
          if (free) { const c = cardOf(modeAt(g.t0 + 0.5)); scrim(g.t0, g.t1); n = el(html); centre(n, c[0] + c[2] / 2, c[1] + c[3] / 2); show(n, g.t0, g.t1, { y: 0, d: 0.2 }); }
          else n = card(g, html);
          g.lines.forEach((l, i) => {
            const ln = n.querySelector(".l" + i);
            reveal(ln, l.t - 0.08, l.style === "pill" ? { s: 0.7, y: 0, ease: "back.out(2)" } : { y: 22 });
            if (l.strike_t) { const s = ln.querySelector(".strike"); gsap.set(s, { scaleX: 0 }); tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, l.strike_t); }
          });
        },
        proj(g) {
          const n = card(g, '<div class="projhead"><span class="ib ' + (TONE[g.icon] || "") + '">' + ic(g.icon) + '</span><div class="t">' + esc(g.title) + "</div></div>" +
            g.rows.map((r, i) => '<div class="row r' + i + '" style="font-size:24px;margin:8px 0">' + esc(r.text) + "</div>").join(""));
          g.rows.forEach((r, i) => i > 0 && reveal(n.querySelector(".r" + i), r.t - 0.05, { x: -16, y: 0 }));
        },
        rowhi(g) {   // highlight bars on the screen card; ys = screen y (px) while the zoom is fully in
          const c = SH.card;
          g.ys.forEach((y) => {
            const n = el('<div class="rowhi"></div>'); css(n, { left: c[0] + "px", width: c[2] + "px", top: y - g.h / 2 + "px", height: g.h + "px" });
            gsap.set(n, { autoAlpha: 0, scaleX: 0, transformOrigin: "0 50%" });
            tl.fromTo(n, { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, g.t0);
            tl.to(n, { autoAlpha: 0, duration: 0.22, ease: OUT }, Math.max(g.t0 + 0.5, g.t1 - 0.22));
          });
        },
        list(g) {
          const n = card(g, ey(g) + (g.title ? "<h3>" + esc(g.title) + "</h3>" : "") + g.rows.map(rowHtml).join(""), g.pos === "card" ? "min-width:760px" : "");
          g.rows.forEach((r, i) => reveal(n.querySelector(".r" + i), r.t - 0.08, { x: -20, y: 0 }));
        },
        matrix(g) {   // {x_label, y_label, dots:[{t,label,x,y,tone}], hot_t}
          const tone = (t) => (t === "pop" ? "POP" : t === "acc" ? "A" : "P");
          const n = card(g, ey(g) + (g.title ? "<h3>" + esc(g.title) + "</h3>" : "") + '<div class="mx">' +
            '<div class="q" style="left:0;top:0"></div><div class="q tr"></div><div class="q" style="left:0;bottom:0"></div><div class="q" style="right:0;bottom:0"></div>' +
            '<div class="ax" style="left:-54px;top:200px;transform:rotate(-90deg)">' + esc(g.y_label || "Impact") + '</div><div class="ax" style="right:0;bottom:-34px">' + esc(g.x_label || "Urgency") + " →</div>" +
            g.dots.map((d, i) => '<div class="dot d' + i + '" style="left:' + d.x * 640 + "px;top:" + d.y * 470 + 'px"><i style="background:var(--' + tone(d.tone) + ')"></i>' + esc(d.label) + "</div>").join("") + "</div>", "padding-bottom:64px");
          g.dots.forEach((d, i) => { const dn = n.querySelector(".d" + i); gsap.set(dn, { xPercent: -14, yPercent: -50 }); reveal(dn, d.t - 0.1, { s: 0.4, y: 0, ease: "back.out(2.4)" }); });
          if (g.hot_t) tl.fromTo(n.querySelector(".q.tr"), { backgroundColor: "rgba(242,106,79,0.12)" }, { backgroundColor: "rgba(242,106,79,0.32)", duration: 0.4, immediateRender: false }, g.hot_t);
        },
        quote(g) { const n = card(g, '<div class="quote">' + esc(g.text) + '</div><div class="qwho">' + esc(g.who || "") + "</div>", g.pos === "card" ? "max-width:980px" : ""); reveal(n.querySelector(".qwho"), g.t + 0.6, { y: 8 }); },
        flow(g) {    // {title, steps:[{t,text}], bubbles:[{t,text}]}
          const n = card(g, ey(g) + "<h3>" + esc(g.title) + '</h3><div class="flow"><div class="steps">' +
            g.steps.map((s, i) => (i ? '<div class="arr a' + i + '"></div>' : "") + '<div class="stp s' + i + '"><b>' + (i + 1) + "</b>" + esc(s.text) + "</div>").join("") +
            '</div><div class="cs">' + (g.bubbles || []).map((b, i) => '<div class="csb c' + i + '">' + esc(b.text) + "</div>").join("") + "</div></div>");
          g.steps.forEach((s, i) => { reveal(n.querySelector(".s" + i), s.t - 0.1, { x: -18, y: 0 }); if (i) reveal(n.querySelector(".a" + i), s.t - 0.15, { y: -6 }); });
          (g.bubbles || []).forEach((b, i) => reveal(n.querySelector(".c" + i), b.t - 0.05, { s: 0.6, y: 0, ease: "back.out(2.2)" }));
        },
        compare(g) {  // {title, old:{t,label,rows[]}, new:{t,label,rows[]}}
          const n = card(g, ey(g) + "<h3>" + esc(g.title || "Before vs after") + '</h3><div class="cmp">' +
            '<div class="side old"><div class="hd" style="color:var(--POPD)">' + esc(g.old.label || "Before") + "</div>" + g.old.rows.map((r) => '<div class="it">' + ic("x") + esc(r) + "</div>").join("") + "</div>" +
            '<div class="side new"><div class="hd" style="color:var(--P)">' + esc(g.new.label || "After") + "</div>" + g.new.rows.map((r) => '<div class="it">' + ic("check") + esc(r) + "</div>").join("") + "</div></div>", "min-width:880px");
          reveal(n.querySelector(".old"), g.old.t - 0.1, { x: -20, y: 0 }); reveal(n.querySelector(".new"), g.new.t - 0.1, { x: 20, y: 0 });
        },
        bar(g) {      // {title, items:[{t,label,pct}]}
          const n = card(g, ey(g) + "<h3>" + esc(g.title) + '</h3><div class="bars">' + g.items.map((x, i) => '<div class="br b' + i + '"><div class="lab"><span>' + esc(x.label) + "</span><span>" + x.pct + '%</span></div><div class="trk"><div class="fill f' + i +
            '" style="width:' + x.pct + "%;background:var(--" + (i % 2 ? "P" : "POP") + ')"></div></div></div>').join("") + "</div>");
          g.items.forEach((x, i) => { reveal(n.querySelector(".b" + i), x.t - 0.2, { y: 10 }); tl.fromTo(n.querySelector(".f" + i), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, x.t - 0.1); });
        },
        track(g) {    // {title, steps:[{t,text}]}
          const n = card(g, ey(g) + "<h3>" + esc(g.title) + '</h3><div class="trk2"><div class="line"></div><div class="linef"></div>' + g.steps.map((s, i) => '<div class="s s' + i + '"><i></i>' + esc(s.text) + "</div>").join("") + "</div>");
          const lf = n.querySelector(".linef"); gsap.set(lf, { height: (g.steps.length - 1) * 68, scaleY: 0 });
          g.steps.forEach((s, i) => { reveal(n.querySelector(".s" + i), s.t - 0.1, { x: -16, y: 0 }); if (i) tl.fromTo(lf, { scaleY: (i - 1) / (g.steps.length - 1) }, { scaleY: i / (g.steps.length - 1), duration: 0.5, ease: "power2.out", immediateRender: false }, s.t - 0.2); });
        },
        big(g) {      // {a:{t,text}, b:{t,text}}
          const n = card(g, ey(g) + '<div class="bigl la">' + esc(g.a.text) + '</div><div class="bigl lb" style="color:var(--P)">' + esc(g.b.text) + "</div>");
          reveal(n.querySelector(".la"), g.a.t - 0.1, { y: 16 }); reveal(n.querySelector(".lb"), g.b.t - 0.1, { s: 0.85, y: 0, ease: "back.out(1.8)" });
        },
        score(g) {    // {title, players:[{name,val,t}]}
          const n = card(g, ey(g) + "<h3>" + esc(g.title) + '</h3><div class="score">' + g.players.map((p, i) => '<div class="p"><div class="nm">' + esc(p.name) + '</div><div class="v v' + i + '">' + esc(p.val) + "</div></div>").join("") + "</div>");
          g.players.forEach((p, i) => reveal(n.querySelector(".v" + i), p.t - 0.05, { s: 0.4, y: 0, ease: "back.out(2.6)" }));
        },
        stamp(g) {    // {t, text, tone:"pop|primary"}  slams onto the card
          const c = cardOf(modeAt(g.t0 + 0.2)); const n = el('<div class="stamp" style="color:var(--' + (g.tone === "primary" ? "P" : "POP") + ')">' + esc(g.text) + "</div>");
          centre(n, c[0] + c[2] / 2, c[1] + c[3] / 2 - 10, -7); gsap.set(n, { autoAlpha: 0 });
          tl.fromTo(n, { autoAlpha: 0, scale: 1.7 }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)", immediateRender: false }, g.t - 0.12);
          tl.to(n, { autoAlpha: 0, duration: 0.25, ease: OUT }, g.t1 - 0.25);
        },
        burst(g) {    // {t, text}  e.g. "10X": big number with rays, lands on the spoken number
          const c = cardOf(modeAt(g.t0 + 0.2)); const n = el('<div class="burst">' + esc(g.text) + "</div>"); centre(n, c[0] + c[2] / 2, c[1] + c[3] / 2 - 10, -4);
          gsap.set(n, { autoAlpha: 0 });
          tl.fromTo(n, { autoAlpha: 0, scale: 0.3 }, { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false }, g.t - 0.1);
          tl.to(n, { autoAlpha: 0, duration: 0.25, ease: OUT }, g.t1 - 0.25);
        },
        lane(g) { const n = el('<div class="lane"><span class="dot">' + ic(g.icon) + "</span>" + esc(g.text) + "</div>"); const c = cardOf(modeAt(g.t0 + 0.2)); css(n, { left: c[0] + 28 + "px", top: c[1] + 28 + "px" }); show(n, g.t0, g.t1, { s: 0.85, y: 0, ease: "back.out(1.6)" }); },
      };
      D.graphics.forEach((g) => { if (!R[g.type]) throw new Error("unknown graphic type " + g.type); R[g.type](g); });
      /* @@TAIL@@ */
      document.fonts.ready.then(() => { if (!document.fonts.check('900 40px "' + (BR.font || "Nunito") + '"')) throw new Error("brand font failed to load"); });
    </script>
  </body>
</html>
