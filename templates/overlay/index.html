<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Overlay</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="data.js"></script>
    <style>
      /* SF Pro on macOS (system font, can't be bundled); Inter (OFL, bundled) everywhere else */
      @font-face { font-family: "Inter"; font-weight: 100 900; font-display: block; src: url("assets/fonts/Inter.ttf") format("truetype"); }
      @font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: block; src: url("assets/fonts/Nunito.ttf") format("truetype"); }
      :root { --P: #0F6E78; --PD: #0A4A52; --A: #F5B320; --POP: #E2604A; --PU: #6B4FA0; --INK: #15202E; --PAPER: #FFFFFF;
              --SOFT: #F4F6F8; --LINE: #E3E7EC; --MUTE: #5D6878;
              --F: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Inter", sans-serif; }
      html, body { margin: 0; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--F); color: var(--PAPER);
              -webkit-font-smoothing: antialiased; }
      #layer > * { position: absolute; box-sizing: border-box; }   /* every top-level element is positioned (no flow-layout leaks) */
      svg.ic { width: 1em; height: 1em; flex: none; }

      /* captions: under the card, calm weight */
      .cap { top: 936px; text-align: center; font-weight: 600; font-size: 40px; line-height: 1.2; letter-spacing: -0.2px;
             text-shadow: 0 1px 10px rgba(0,20,24,.35); white-space: nowrap; }
      .cap .w { opacity: .45; } .cap .w.k { color: var(--A); } .cap.alt .w { color: #D6F2EF; } .cap.alt .w.k { color: var(--A); }

      /* chapter chip (column or panel top) */
      .chip-ch { text-align: center; }
      .chip-ch .n { font: 600 20px var(--F); letter-spacing: 1.5px; text-transform: uppercase; color: var(--A); }
      .chip-ch .t { font: 600 24px var(--F); margin-top: 2px; opacity: .95; }

      /* side cards: column (share mode) and panel (talk mode). Light, quiet, readable. Scoped: never inherits stage sizes */
      .side { background: var(--PAPER); color: var(--INK); border-radius: 22px; padding: 26px 28px; box-shadow: 0 10px 30px rgba(0,20,25,.18); }
      .side.panel { padding: 36px 40px; border-radius: 26px; }
      .side .hd { font: 700 30px/1.15 var(--F); letter-spacing: -0.3px; margin: 0 0 12px; }
      .side.panel .hd { font-size: 40px; margin-bottom: 18px; }
      .side .rw { display: flex; align-items: center; gap: 12px; font: 600 24px/1.25 var(--F); margin: 10px 0; }
      .side.panel .rw { font-size: 32px; gap: 16px; margin: 14px 0; }
      .side .ib { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;
                  color: var(--P); background: color-mix(in srgb, var(--P) 12%, white); flex: none; }
      .side.panel .ib { width: 52px; height: 52px; font-size: 26px; border-radius: 14px; }
      .side .big { font: 700 44px/1.15 var(--F); letter-spacing: -0.5px; margin: 6px 0; }
      .side .big.b { color: var(--P); }
      .side .qt { font: 600 34px/1.3 var(--F); } .side .who { margin-top: 14px; font: 500 22px var(--F); color: var(--MUTE); }
      .side .bar { margin: 16px 0; } .side .bar .lab { display: flex; justify-content: space-between; font: 600 28px var(--F); }
      .side .bar .trk { height: 18px; border-radius: 9px; background: var(--SOFT); overflow: hidden; margin-top: 8px; }
      .side .bar .fill { height: 100%; border-radius: 9px; background: var(--P); transform-origin: 0 50%; }
      .side .score { display: flex; gap: 18px; } .side .score .p { flex: 1; text-align: center; background: var(--SOFT); border-radius: 18px; padding: 16px; }
      .side .score .nm { font: 500 24px var(--F); color: var(--MUTE); } .side .score .v { font: 700 72px/1.1 var(--F); color: var(--P); }
      .side .trk2 .s { display: flex; gap: 14px; align-items: center; font: 600 28px var(--F); margin: 0 0 18px; }
      .side .trk2 .s i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--P); flex: none; }

      /* speech bubble from the other person (column) */
      .bub { background: var(--PAPER); color: var(--INK); border-radius: 22px; padding: 18px 22px 20px; box-shadow: 0 10px 30px rgba(0,20,25,.18); }
      .bub .lbl { display: flex; align-items: center; gap: 8px; font: 600 20px var(--F); color: var(--P); margin-bottom: 6px; }
      .bub .txt { font: 600 24px/1.3 var(--F); }

      /* label chip at the card's top-left: names what's on screen */
      .lane { display: flex; align-items: center; gap: 10px; background: rgba(21,32,46,.88); font: 600 24px var(--F); padding: 10px 18px 10px 12px;
              border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.18); white-space: nowrap; }
      .lane .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--A); color: var(--INK); display: flex; align-items: center; justify-content: center; font-size: 17px; }

      /* highlight on a visual screen: outline, no veil */
      .rowhi { border: 3px solid var(--A); border-radius: 8px; background: color-mix(in srgb, var(--A) 10%, transparent); }

      /* STAGE: a full motion scene that REPLACES a text-only slide (same box as the screen card). Scoped sizes. */
      .stage { background: var(--PAPER); color: var(--INK); border-radius: 22px; overflow: hidden; padding: 72px 96px; display: flex; flex-direction: column; justify-content: center; }
      .stage .s-kick { font: 600 26px var(--F); color: var(--P); letter-spacing: 0.5px; margin-bottom: 18px; }
      .stage .s-line { font: 700 76px/1.1 var(--F); letter-spacing: -1.5px; margin: 6px 0; }
      .stage .s-line.sub { font: 500 40px/1.3 var(--F); letter-spacing: -0.3px; color: var(--MUTE); }
      .stage .s-title { font: 700 56px/1.1 var(--F); letter-spacing: -1px; margin: 0 0 34px; }
      .stage .s-item { display: flex; align-items: center; gap: 22px; font: 600 44px/1.25 var(--F); margin: 16px 0; }
      .stage .s-item .ib { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px;
                           color: var(--P); background: color-mix(in srgb, var(--P) 12%, white); flex: none; }
      .stage .s-stat { font: 700 200px/1 var(--F); letter-spacing: -6px; color: var(--P); }
      .stage .s-statlab { font: 600 48px/1.25 var(--F); margin-top: 18px; max-width: 1100px; }
      .stage .s-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
      .stage .s-side { border-radius: 24px; padding: 30px 34px; background: var(--SOFT); }
      .stage .s-side.new { background: color-mix(in srgb, var(--P) 10%, white); }
      .stage .s-side .lb { font: 700 36px var(--F); margin-bottom: 14px; } .stage .s-side .it { display: flex; gap: 14px; align-items: center; font: 600 34px var(--F); margin: 12px 0; }
      .stage .s-steps { display: flex; gap: 22px; align-items: stretch; }
      .stage .s-step { flex: 1; background: var(--SOFT); border-radius: 22px; padding: 26px; font: 600 34px/1.25 var(--F); }
      .stage .s-step b { display: block; font: 700 26px var(--F); color: var(--P); margin-bottom: 10px; }
      .stage .s-quote { font: 600 64px/1.2 var(--F); letter-spacing: -1px; } .stage .s-who { margin-top: 26px; font: 500 30px var(--F); color: var(--MUTE); }
      .stage .s-mx { position: relative; width: 760px; height: 520px; margin: 0 auto; }
      .stage .s-mx .q { position: absolute; width: 50%; height: 50%; border: 2px solid var(--LINE); box-sizing: border-box; }
      .stage .s-mx .q.hot { right: 0; top: 0; background: color-mix(in srgb, var(--POP) 10%, white); }
      .stage .s-mx .ax { position: absolute; font: 600 24px var(--F); color: var(--MUTE); }
      .stage .s-mx .dot { position: absolute; display: flex; align-items: center; gap: 12px; font: 600 30px var(--F); white-space: nowrap; }
      .stage .s-mx .dot i { width: 22px; height: 22px; border-radius: 50%; display: block; background: var(--P); }

      /* full-frame cards: title / chapter / end */
      .full { inset: 0; overflow: hidden; z-index: 10; background: linear-gradient(135deg, var(--P) 0%, var(--PD) 100%); }
      .full .orb { position: absolute; width: 900px; height: 900px; right: -260px; bottom: -380px; border-radius: 50%; background: var(--A); opacity: .85; }
      .full .inner { position: absolute; left: 160px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
      .full .kick { font: 600 30px var(--F); letter-spacing: 1px; color: var(--A); }
      .full .big { font: 700 112px/1.02 var(--F); letter-spacing: -3px; margin-top: 16px; max-width: 1250px; }
      .full .sub { font: 500 36px var(--F); opacity: .85; margin-top: 24px; }
      .full .num { font: 700 40px var(--F); color: var(--INK); background: var(--A); width: 84px; height: 84px; border-radius: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
      .full .pill { display: inline-flex; align-items: center; gap: 16px; margin-top: 36px; background: var(--PAPER); color: var(--P); font: 700 40px var(--F); padding: 18px 32px; border-radius: 999px; width: max-content; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080" data-fps="30"><div id="layer"></div></div>
    <script>
      /* ======================================================================================
         Overlay component library, driven by data.js (cues_lib.py). Zones are resolved in cues_lib:
         stage | col | panel | label | highlight | full, at most one item per zone at a time.
         SEEK-SAFETY (the renderer steps frames in its own order; a snapshot is NOT proof):
           - visibility = a tween with BOTH ends declared (fromTo autoAlpha 0->1, to autoAlpha 0); never tl.set for it
           - every fromTo after t=0 passes immediateRender:false
           - GSAP owns transform: centre with xPercent/yPercent, never CSS translate
         TASTE (references/taste.md): light cards, weights 500-700, calm easing, no veils, no bouncy pops, no bursts.
         ====================================================================================== */
      const D = window.DATA, root = document.documentElement, BR = D.brand || {};
      [["--P", "primary"], ["--PD", "primary_dark"], ["--A", "accent"], ["--POP", "pop"], ["--PU", "purple"], ["--INK", "ink"], ["--PAPER", "paper"]]
        .forEach(([v, k]) => BR[k] && root.style.setProperty(v, BR[k]));
      if (BR.font && BR.font !== "system") root.style.setProperty("--F", '"' + BR.font + '", -apple-system, "Inter", sans-serif');
      const layer = document.getElementById("layer");
      const LAY = D.layout, SH = LAY.share, TK = LAY.talk;
      const first = (spk) => ((D.names || {})[spk] || "").split(" ")[0];
      const ICONS = {
        msg: '<path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>',
        layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>',
        receipt: '<path d="M12 17V7"/><path d="M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/><path d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/>',
        zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', check: '<path d="M20 6 9 17l-5-5"/>',
        trend: '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
        pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
        swap: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
        sparkles: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>',
        flag: '<path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        play: '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
        tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>',
      };
      const ic = (n) => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || ICONS.check) + "</svg>";
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const css = (n, o) => Object.assign(n.style, o);
      const el = (html, kind) => { const t = document.createElement("template"); t.innerHTML = html.trim(); const n = t.content.firstChild; if (kind) n.dataset.kind = kind; layer.appendChild(n); return n; };
      const centre = (n, x, y) => { css(n, { left: x + "px", top: y + "px" }); gsap.set(n, { xPercent: -50, yPercent: -50 }); };
      const modeAt = (t) => (D.modes.find((m) => t >= m.t0 - 0.01 && t < m.t1) || D.modes[D.modes.length - 1]).mode;
      const cardOf = (md) => (md === "talk" && TK ? TK.card : SH.card);
      const colBox = () => { const c = SH.card, x = c[0] + c[2] + 24; return { x, y: SH.face ? SH.face[1] + SH.face[2] + 150 : c[1] + 90, w: 1920 - x - 24 }; };
      const panelBox = () => { const c = (TK || SH).card, x = c[0] + c[2] + 48; return { x, y: c[1], w: 1920 - x - 56, h: c[3] }; };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.set({}, {}, D.total);
      const IN = "power3.out", OUT = "power2.in", COVER = 0.34;

      /* calm motion: short fades + small rises; no overshoot */
      function show(n, t0, t1, o) {
        o = o || {}; gsap.set(n, { autoAlpha: 0 });
        tl.fromTo(n, { autoAlpha: 0, y: o.y ?? 10 }, { autoAlpha: 1, y: 0, duration: o.d ?? 0.5, ease: IN, immediateRender: false }, t0);
        tl.to(n, { autoAlpha: 0, duration: 0.3, ease: OUT }, Math.max(t0 + 0.5, t1 - 0.3));
      }
      function reveal(n, t, o) {
        o = o || {}; gsap.set(n, { autoAlpha: 0 });
        tl.fromTo(n, { autoAlpha: 0, x: o.x ?? 0, y: o.y ?? 8 }, { autoAlpha: 1, x: 0, y: 0, duration: o.d ?? 0.45, ease: IN, immediateRender: false }, t);
      }
      /* a child spoken at/before its parent's entrance appears WITH the parent; cues_lib already moved t0 so the
         first child lands with the entrance (no empty card) */
      const childT = (g, t) => Math.max(t - 0.1, g.t0 + 0.05);
      const rowsHTML = (rows, cls) => rows.map((r, i) => '<div class="' + cls + " r" + i + '">' + (r.icon ? '<span class="ib">' + ic(r.icon) + "</span>" : "") + esc(r.text) + "</div>").join("");

      /* ---------- captions ---------- */
      const presenter = Object.keys(D.names || {})[0];
      D.captions.forEach((c) => {
        const n = el('<div class="cap' + (c.who !== presenter ? " alt" : "") + '">' + c.w.map((w) => '<span class="w' + (w.k ? " k" : "") + '">' + esc(w.x) + "</span>").join(" ") + "</div>", "caption");
        const cc = cardOf(c.mode); css(n, { left: cc[0] + "px", width: cc[2] + "px" });
        gsap.set(n, { autoAlpha: 0 });
        tl.fromTo(n, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15, ease: "power1.out", immediateRender: false }, c.t0);
        const sp = n.querySelectorAll(".w");
        c.w.forEach((w, k) => tl.fromTo(sp[k], { opacity: 0.45 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, w.t));
        tl.to(n, { autoAlpha: 0, duration: 0.1, ease: "none" }, Math.max(c.t0 + 0.16, c.t1 - 0.1));
      });
      /* ---------- bubbles (column zone) ---------- */
      D.bubbles.forEach((b) => {
        const n = el('<div class="bub"><div class="lbl">' + ic("msg") + esc(first(b.who)) + (b.kind === "q" ? " asks" : "") + '</div><div class="txt">' + esc(b.text) + "</div></div>", "col");
        const bx = colBox(); css(n, { left: bx.x + "px", top: bx.y + "px", width: bx.w + "px" });
        show(n, b.t0, b.t1, { y: 8 });
      });
      /* ---------- chapter chips ---------- */
      D.chips.forEach((c) => D.modes.forEach((m) => {
        const a = Math.max(c.t0 + 0.2, m.t0), b = Math.min(c.t1 - COVER, m.t1);
        if (b - a < 0.6) return;
        const n = el('<div class="chip-ch"><div class="n">Chapter ' + c.n + " of " + D.nch + '</div><div class="t">' + esc(c.title) + "</div></div>", "chip");
        if (m.mode === "share") { const bx = colBox(); css(n, { left: bx.x + "px", width: bx.w + "px", top: bx.y - 72 + "px" }); }   // between name tag and column content
        else { const p = panelBox(); css(n, { left: p.x + "px", width: p.w + "px", top: "64px" }); }
        show(n, a, b, { y: 4 });
      }));
      /* ---------- full-frame cards ---------- */
      function fullCard(html, t0, tEnd, slide) {
        const n = el('<div class="full"><div class="orb" data-layout-allow-overflow></div><div class="inner">' + html + "</div></div>", "full");
        gsap.set(n, { autoAlpha: 0 });
        tl.fromTo(n, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: "none", immediateRender: false }, t0);
        tl.fromTo(n, { xPercent: -100 }, { xPercent: 0, duration: slide, ease: "power3.out", immediateRender: false }, t0);
        if (tEnd != null) { tl.to(n, { xPercent: 100, duration: COVER, ease: "power3.in" }, tEnd); tl.to(n, { autoAlpha: 0, duration: 0.04, ease: "none" }, tEnd + COVER - 0.04); }
        return n;
      }
      {
        const T = D.title, t0 = T.start - COVER;
        const n = fullCard('<div class="kick">' + esc(T.kicker || "") + '</div><div class="big">' + (T.big || "") + '</div><div class="sub">' + esc(T.sub || "") + "</div>", t0, null, COVER);
        [".kick", ".big", ".sub"].forEach((s, k) => reveal(n.querySelector(s), t0 + 0.15 + k * 0.1, { y: 16 }));
        tl.to(n, { autoAlpha: 0, duration: 0.04, ease: "none" }, T.start + T.dur + COVER - 0.04);
      }
      D.chapters.forEach((c) => {
        const t0 = c.n === 1 ? c.start : c.start - COVER;
        const n = fullCard('<div class="num">' + String(c.n).padStart(2, "0") + '</div><div class="kick">' + esc(c.kicker) + '</div><div class="big">' + esc(c.title) + "</div>", t0, c.start + c.dur, COVER);
        reveal(n.querySelector(".num"), t0 + 0.12, { y: 0 }); reveal(n.querySelector(".kick"), t0 + 0.18, { y: 12 }); reveal(n.querySelector(".big"), t0 + 0.24, { y: 18 });
      });
      {
        const E = D.end, t0 = E.start - COVER;
        const n = fullCard('<div class="kick">' + esc(E.kicker || "") + '</div><div class="big">' + esc(E.big || "Questions?") + "</div>" + (E.cta ? '<div class="pill">' + ic("msg") + esc(E.cta) + "</div>" : "") + '<div class="sub" style="margin-top:40px">' + esc(E.sub || "") + "</div>", t0, null, COVER + 0.1);
        n.querySelectorAll(".inner > *").forEach((x, k) => reveal(x, t0 + 0.3 + k * 0.25, { y: 14 }));
      }

      /* ---------- side cards (col / panel zones) ---------- */
      function side(g, inner) {
        const panel = g.pos === "panel";
        const n = el('<div class="side' + (panel ? " panel" : "") + '">' + inner + "</div>", panel ? "panel" : "col");
        if (panel) { const p = panelBox(); css(n, { width: p.w + "px" }); centre(n, p.x + p.w / 2, p.y + p.h / 2); }
        else { const b = colBox(); css(n, { left: b.x + "px", top: b.y + "px", width: b.w + "px" }); }
        show(n, g.t0, g.t1);
        return n;
      }
      /* ---------- stage zone: a full motion scene replacing a text-only slide (exactly over the screen card) ---------- */
      function stage(g, inner) {
        const c = cardOf(modeAt(g.t0 + 0.3));
        const n = el('<div class="stage">' + inner + "</div>", "stage");
        css(n, { left: c[0] + "px", top: c[1] + "px", width: c[2] + "px", height: c[3] + "px" });
        gsap.set(n, { autoAlpha: 0 });
        tl.fromTo(n, { autoAlpha: 0, scale: 0.985 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: IN, immediateRender: false }, g.t0);
        tl.to(n, { autoAlpha: 0, duration: 0.35, ease: OUT }, Math.max(g.t0 + 0.6, g.t1 - 0.35));
        return n;
      }
      const R = {
        stage(g) {
          let n; const L = g.layout || "headline";
          if (L === "headline") {
            n = stage(g, (g.kicker ? '<div class="s-kick">' + esc(g.kicker) + "</div>" : "") + g.lines.map((l, i) => '<div class="s-line ' + (l.style || "") + " l" + i + '">' + esc(l.text) + "</div>").join(""));
            g.lines.forEach((l, i) => reveal(n.querySelector(".l" + i), childT(g, l.t), { y: 18 }));
          } else if (L === "bullets") {
            n = stage(g, '<div class="s-title">' + esc(g.title) + "</div>" + rowsHTML(g.items, "s-item"));
            g.items.forEach((r, i) => reveal(n.querySelector(".r" + i), childT(g, r.t), { x: -16, y: 0 }));
          } else if (L === "stat") {
            n = stage(g, '<div class="s-stat">' + esc(g.value) + '</div><div class="s-statlab">' + esc(g.label) + "</div>");
            reveal(n.querySelector(".s-stat"), childT(g, g.t), { y: 24 }); reveal(n.querySelector(".s-statlab"), childT(g, g.t) + 0.2, { y: 12 });
          } else if (L === "compare") {
            const sd = (s, cls) => '<div class="s-side ' + cls + '"><div class="lb">' + esc(s.label) + "</div>" + s.rows.map((r) => '<div class="it">' + ic(cls === "new" ? "check" : "x") + esc(r) + "</div>").join("") + "</div>";
            n = stage(g, (g.title ? '<div class="s-title">' + esc(g.title) + "</div>" : "") + '<div class="s-cmp">' + sd(g.old, "old") + sd(g.new, "new") + "</div>");
            reveal(n.querySelector(".old"), childT(g, g.old.t), { x: -16, y: 0 }); reveal(n.querySelector(".new"), childT(g, g.new.t), { x: 16, y: 0 });
          } else if (L === "steps") {
            n = stage(g, (g.title ? '<div class="s-title">' + esc(g.title) + "</div>" : "") + '<div class="s-steps">' + g.steps.map((s, i) => '<div class="s-step r' + i + '"><b>' + (i + 1) + "</b>" + esc(s.text) + "</div>").join("") + "</div>");
            g.steps.forEach((s, i) => reveal(n.querySelector(".r" + i), childT(g, s.t), { y: 14 }));
          } else if (L === "quote") {
            stage(g, '<div class="s-quote">' + esc(g.text) + '</div><div class="s-who">' + esc(g.who || "") + "</div>");
          } else if (L === "matrix") {
            n = stage(g, (g.title ? '<div class="s-title">' + esc(g.title) + "</div>" : "") + '<div class="s-mx"><div class="q" style="left:0;top:0"></div><div class="q hot"></div><div class="q" style="left:0;bottom:0"></div><div class="q" style="right:0;bottom:0"></div>' +
              '<div class="ax" style="left:-70px;top:240px;transform:rotate(-90deg)">' + esc(g.y_label || "Impact") + '</div><div class="ax" style="right:0;bottom:-38px">' + esc(g.x_label || "Urgency") + " →</div>" +
              g.dots.map((d, i) => '<div class="dot d' + i + '" style="left:' + d.x * 760 + "px;top:" + d.y * 520 + 'px"><i></i>' + esc(d.label) + "</div>").join("") + "</div>");
            g.dots.forEach((d, i) => { const dn = n.querySelector(".d" + i); gsap.set(dn, { yPercent: -50 }); reveal(dn, childT(g, d.t), { y: 0 }); });
          } else throw new Error("unknown stage layout " + L);
        },
        list(g) { const n = side(g, (g.title ? '<div class="hd">' + esc(g.title) + "</div>" : "") + rowsHTML(g.rows, "rw")); g.rows.forEach((r, i) => reveal(n.querySelector(".r" + i), childT(g, r.t), { x: -12, y: 0 })); },
        big(g) { const n = side(g, '<div class="big a">' + esc(g.a.text) + '</div><div class="big b">' + esc(g.b.text) + "</div>"); reveal(n.querySelector(".a"), childT(g, g.a.t)); reveal(n.querySelector(".b"), childT(g, g.b.t)); },
        quote(g) { side(g, '<div class="qt">' + esc(g.text) + '</div><div class="who">' + esc(g.who || "") + "</div>"); },
        bar(g) {
          const n = side(g, '<div class="hd">' + esc(g.title) + "</div>" + g.items.map((x, i) => '<div class="bar b' + i + '"><div class="lab"><span>' + esc(x.label) + "</span><span>" + x.pct + '%</span></div><div class="trk"><div class="fill f' + i + '" style="width:' + x.pct + '%"></div></div></div>').join(""));
          g.items.forEach((x, i) => { reveal(n.querySelector(".b" + i), childT(g, x.t)); tl.fromTo(n.querySelector(".f" + i), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: IN, immediateRender: false }, childT(g, x.t)); });
        },
        track(g) { const n = side(g, '<div class="hd">' + esc(g.title) + '</div><div class="trk2">' + g.steps.map((s, i) => '<div class="s r' + i + '"><i></i>' + esc(s.text) + "</div>").join("") + "</div>"); g.steps.forEach((s, i) => reveal(n.querySelector(".r" + i), childT(g, s.t), { x: -10, y: 0 })); },
        score(g) {
          const n = side(g, '<div class="hd">' + esc(g.title) + '</div><div class="score">' + g.players.map((p, i) => '<div class="p"><div class="nm">' + esc(p.name) + '</div><div class="v v' + i + '">' + esc(p.val) + "</div></div>").join("") + "</div>");
          g.players.forEach((p, i) => reveal(n.querySelector(".v" + i), childT(g, p.t), { y: 10 }));
        },
        proj(g) { const n = side(g, '<div class="hd">' + esc(g.title) + "</div>" + rowsHTML(g.rows, "rw")); g.rows.forEach((r, i) => reveal(n.querySelector(".r" + i), childT(g, r.t), { x: -12, y: 0 })); },
        rowhi(g) {   // highlight zone: visual screens only, never during a stage
          const c = SH.card;
          g.ys.forEach((y) => { const n = el('<div class="rowhi"></div>', "highlight"); css(n, { left: c[0] + 8 + "px", width: c[2] - 16 + "px", top: y - g.h / 2 + "px", height: g.h + "px" }); show(n, g.t0, g.t1, { y: 0, d: 0.35 }); });
        },
        lane(g) { const c = cardOf(modeAt(g.t0 + 0.2)); const n = el('<div class="lane"><span class="dot">' + ic(g.icon) + "</span>" + esc(g.text) + "</div>", "label"); css(n, { left: c[0] + 24 + "px", top: c[1] + 24 + "px" }); show(n, g.t0, g.t1, { y: 0 }); },
      };
      D.graphics.forEach((g) => { if (!R[g.type]) throw new Error("unknown graphic type " + g.type + " (see references/motion-graphics.md)"); R[g.type](g); });

      /* layout-audit hook: boxes of everything visible at time t (scripts/layout_audit.mjs) */
      window.__audit = (t) => {
        tl.seek(t, false);
        const out = [];
        layer.querySelectorAll(":scope > *").forEach((n) => {
          const cs = getComputedStyle(n); if (cs.visibility === "hidden" || +cs.opacity < 0.05) return;
          const r = n.getBoundingClientRect();
          const texts = [n, ...n.querySelectorAll("*")].filter((x) => [...x.childNodes].some((c) => c.nodeType === 3 && c.textContent.trim()));
          const vis = texts.filter((x) => { const s = getComputedStyle(x); return s.visibility !== "hidden" && +s.opacity > 0.3; });
          const minFont = vis.reduce((m, x) => Math.min(m, parseFloat(getComputedStyle(x).fontSize)), 999);
          // block-level children only: inline text boxes are taller than their line box by design (font ascent/descent)
          const overflow = [...n.querySelectorAll("*")].some((x) => { if (x.closest("[data-layout-allow-overflow]") || getComputedStyle(x).display === "inline") return false;
            const b = x.getBoundingClientRect(); return b.width > 0 && (b.right > r.right + 2 || b.bottom > r.bottom + 2 || b.left < r.left - 2 || b.top < r.top - 2); });
          out.push({ kind: n.dataset.kind || "?", x: r.left, y: r.top, w: r.width, h: r.height, op: +cs.opacity, text: vis.map((x) => x.textContent.trim()).join(" ").slice(0, 60), nText: vis.length, minFont, overflow });
        });
        return out;
      };
      /* @@TAIL@@ */
      document.fonts.ready.then(() => {
        if (!/Mac/.test(navigator.platform) && !document.fonts.check('600 40px "Inter"')) throw new Error("Inter failed to load");
      });
    </script>
  </body>
</html>
